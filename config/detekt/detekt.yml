# Applied on top of detekt's default config (buildUponDefaultConfig = true).
# Only deviations from the defaults belong here, each with a reason.

naming:
  FunctionNaming:
    # Composables returning Unit are PascalCase (Compose API guidelines)
    ignoreAnnotated:
      - Composable

complexity:
  LongParameterList:
    # Composables and test-data builders use defaulted parameters by design
    ignoreDefaultParameters: true
    # Stateless screens take one callback per user action (UDF), see CLAUDE.md §7
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    # Color literals in the theme are design tokens, not magic numbers
    ignorePropertyDeclaration: true
    # Sample data in previews
    ignoreAnnotated:
      - Preview
    # Enum constructor values are definitions, not magic numbers
    ignoreEnums: true
  UnusedPrivateMember:
    # @Preview functions are private and only used by tooling
    ignoreAnnotated:
      - Preview

# Compose rules (io.nlopez.compose.rules) are active by default; only opt-ins listed here.
Compose:
  Material2:
    # Material 3 only
    active: true
  UnstableCollections:
    active: true
