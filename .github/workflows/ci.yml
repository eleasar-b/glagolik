name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads its Android framework jars (~150 MB) outside of Gradle
      - name: Cache Robolectric jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      # A fixed debug keystore keeps the signature stable across CI runs,
      # so new debug APKs install as updates over older ones.
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.GLAGOLIK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::warning::GLAGOLIK_DEBUG_KEYSTORE_BASE64 not set (e.g. fork PR); using a random debug key"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :tools:importer:test

      - name: Verb data up to date
        run: ./gradlew :tools:importer:verifyVerbs

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Guardrail - no INTERNET permission
        run: |
          manifest=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml -path '*merged_manifest*' | head -n 1)
          test -n "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::INTERNET permission found in merged manifest ($manifest)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: glagolik-debug-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
